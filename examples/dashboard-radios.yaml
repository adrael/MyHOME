# A "Radios" view for the sound diffusion amplifiers.
#
# Requires Home Assistant 2025.1 or later. What each version brought:
# `perform-action` and the services -> actions rename 2024.8, the `sections`
# view and the `heading` card 2024.10, the `numeric-input` tile feature 2024.11,
# the `media-player-volume-slider` tile feature 2025.1 (the floor), its
# `show_mute_button` option 2026.6, and the `media-player-source` feature — the
# station dropdown — 2026.5. On an older version drop that one feature and pick
# the station from the amplifier's more-info dialog, where the Source menu sits
# whatever the version.
#
# Paste the `- title: Radios` item below INTO the `views:` list your dashboard
# already has ("Edit dashboard" > 3-dot menu > "Raw configuration editor").
# Do not paste the whole file over the editor: that would drop your other views.
#
# Entity ids follow the `name:` of the amplifiers in `myhome.yaml`:
# "Radio Cuisine" gives `media_player.radio_cuisine`.
#
# One tuner is shared by every amplifier, so it is shown once, at the top, as
# its own device: three attribute rows saying what it plays, its station as a
# dropdown, its frequency as a slider, and its four buttons. Only the attribute
# rows read an amplifier, and only to display; every control of that section
# addresses the tuner itself, which is why none of it can be pointed at a group
# by mistake. The tuner attributes are published whether an amplifier is playing
# or not, so those rows stay readable with the whole house switched off.
#
# One tile per amplifier:
#   tap on the icon   -> toggles that amplifier (`media_player.toggle`)
#   tap on the tile   -> the more-info dialog, where the Source menu is
#   slider            -> volume (0-31 on the bus)
#   under the name    -> its state and "106.0 MHz · SUD RADIO"
#
# An empty Station dropdown means the frequency the tuner reports is not in the
# station table; see the `radio_stations` option of the gateway — the "RDS" row
# then says what the station calls itself. A blank "Preset" row means the tuner
# left the slot it was on — a seek does that. A blank "RDS" row is a station
# broadcasting nothing, or a frequency that has just changed.
#
# Card widths follow the Home Assistant defaults for sections; on 2024.11+ you
# can pin them with `grid_options: {columns: 6}` per card.

views:
  - title: Radios
    path: radios
    icon: mdi:radio
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Tuner
            heading_style: title
            icon: mdi:radio-tower
          - type: entities
            state_color: false
            entities:
              - type: attribute
                entity: media_player.radio_cuisine
                attribute: frequency_mhz
                name: Frequency
                suffix: " MHz"
                icon: mdi:sine-wave
              - type: attribute
                entity: media_player.radio_cuisine
                attribute: preset
                name: Preset
                icon: mdi:numeric
              - type: attribute
                entity: media_player.radio_cuisine
                attribute: rds_name
                name: RDS
                icon: mdi:radio-tower
          # The station, on the tuner rather than on a speaker: the same list
          # and the same frame as the Source menu of an amplifier, in the one
          # place that cannot be pointed at a group by mistake. On a Home
          # Assistant too old for the `select-options` tile feature, drop the
          # feature and pick the station from the tile's more-info dialog.
          - type: tile
            entity: select.tuner_fm_station
            name: Station
            icon: mdi:playlist-music
            features:
              - type: select-options
          # The tuner's own frequency, in MHz. Dragging it retunes the box, and
          # spends the `tuning_preset` slot doing so — see the README.
          - type: tile
            entity: number.tuner_fm_frequency
            name: Frequency
            icon: mdi:sine-wave
            features:
              - type: numeric-input
                style: slider
          # The four buttons of the tuner device. They address the source, not
          # an amplifier, so there is nothing here to point at a group by
          # mistake.
          - type: entities
            state_color: false
            entities:
              - entity: button.tuner_fm_previous_preset
                name: Previous preset
              - entity: button.tuner_fm_next_preset
                name: Next preset
              - entity: button.tuner_fm_seek_down
                name: Seek down
              - entity: button.tuner_fm_seek_up
                name: Seek up
          - type: button
            name: Turn every amplifier off
            icon: mdi:speaker-off
            tap_action:
              action: perform-action
              perform_action: media_player.turn_off
              target:
                entity_id:
                  - media_player.radio_cuisine
                  - media_player.radio_suite
                  - media_player.radio_suite_sdb
                  - media_player.radio_office_1
                  - media_player.radio_office_1_sdb
                  - media_player.radio_gym
                  - media_player.radio_chambre_ami
                  - media_player.radio_chambre_ami_sdb
                  - media_player.radio_office_2
                  - media_player.radio_office_2_sdb

      - type: grid
        cards:
          - type: heading
            heading: Kitchen
            heading_style: title
            icon: mdi:silverware-fork-knife
          # The station dropdown sits on this tile alone: it retunes the one
          # tuner the whole house listens to, so repeating it per room would
          # only offer ten ways to do the same thing.
          - type: tile
            entity: media_player.radio_cuisine
            name: Kitchen
            icon: mdi:silverware-fork-knife
            state_content:
              - state
              - media_title
            tap_action:
              action: more-info
            icon_tap_action:
              action: perform-action
              perform_action: media_player.toggle
              target:
                entity_id: media_player.radio_cuisine
            features:
              - type: media-player-volume-slider
                show_mute_button: false
              - type: media-player-source

      - type: grid
        cards:
          - type: heading
            heading: Master suite
            heading_style: title
            icon: mdi:bed-king
          - type: tile
            entity: media_player.radio_suite
            name: Suite
            icon: mdi:bed-king
            state_content:
              - state
              - media_title
            tap_action:
              action: more-info
            icon_tap_action:
              action: perform-action
              perform_action: media_player.toggle
              target:
                entity_id: media_player.radio_suite
            features:
              - type: media-player-volume-slider
                show_mute_button: false
          - type: tile
            entity: media_player.radio_suite_sdb
            name: Suite bathroom
            icon: mdi:shower
            state_content:
              - state
              - media_title
            tap_action:
              action: more-info
            icon_tap_action:
              action: perform-action
              perform_action: media_player.toggle
              target:
                entity_id: media_player.radio_suite_sdb
            features:
              - type: media-player-volume-slider
                show_mute_button: false

      - type: grid
        cards:
          - type: heading
            heading: Office 1
            heading_style: title
            icon: mdi:desktop-tower-monitor
          - type: tile
            entity: media_player.radio_office_1
            name: Office 1
            icon: mdi:desktop-tower-monitor
            state_content:
              - state
              - media_title
            tap_action:
              action: more-info
            icon_tap_action:
              action: perform-action
              perform_action: media_player.toggle
              target:
                entity_id: media_player.radio_office_1
            features:
              - type: media-player-volume-slider
                show_mute_button: false
          - type: tile
            entity: media_player.radio_office_1_sdb
            name: Office 1 bathroom
            icon: mdi:shower
            state_content:
              - state
              - media_title
            tap_action:
              action: more-info
            icon_tap_action:
              action: perform-action
              perform_action: media_player.toggle
              target:
                entity_id: media_player.radio_office_1_sdb
            features:
              - type: media-player-volume-slider
                show_mute_button: false

      - type: grid
        cards:
          - type: heading
            heading: Gym
            heading_style: title
            icon: mdi:dumbbell
          - type: tile
            entity: media_player.radio_gym
            name: Gym
            icon: mdi:dumbbell
            state_content:
              - state
              - media_title
            tap_action:
              action: more-info
            icon_tap_action:
              action: perform-action
              perform_action: media_player.toggle
              target:
                entity_id: media_player.radio_gym
            features:
              - type: media-player-volume-slider
                show_mute_button: false

      - type: grid
        cards:
          - type: heading
            heading: Guest room
            heading_style: title
            icon: mdi:bed
          - type: tile
            entity: media_player.radio_chambre_ami
            name: Guest room
            icon: mdi:bed
            state_content:
              - state
              - media_title
            tap_action:
              action: more-info
            icon_tap_action:
              action: perform-action
              perform_action: media_player.toggle
              target:
                entity_id: media_player.radio_chambre_ami
            features:
              - type: media-player-volume-slider
                show_mute_button: false
          - type: tile
            entity: media_player.radio_chambre_ami_sdb
            name: Guest bathroom
            icon: mdi:shower
            state_content:
              - state
              - media_title
            tap_action:
              action: more-info
            icon_tap_action:
              action: perform-action
              perform_action: media_player.toggle
              target:
                entity_id: media_player.radio_chambre_ami_sdb
            features:
              - type: media-player-volume-slider
                show_mute_button: false

      - type: grid
        cards:
          - type: heading
            heading: Office 2
            heading_style: title
            icon: mdi:desktop-tower-monitor
          - type: tile
            entity: media_player.radio_office_2
            name: Office 2
            icon: mdi:desktop-tower-monitor
            state_content:
              - state
              - media_title
            tap_action:
              action: more-info
            icon_tap_action:
              action: perform-action
              perform_action: media_player.toggle
              target:
                entity_id: media_player.radio_office_2
            features:
              - type: media-player-volume-slider
                show_mute_button: false
          - type: tile
            entity: media_player.radio_office_2_sdb
            name: Office 2 bathroom
            icon: mdi:shower
            state_content:
              - state
              - media_title
            tap_action:
              action: more-info
            icon_tap_action:
              action: perform-action
              perform_action: media_player.toggle
              target:
                entity_id: media_player.radio_office_2_sdb
            features:
              - type: media-player-volume-slider
                show_mute_button: false

# The station dropdown sits on the kitchen tile alone. Never repeat it on every
# tile and never point a station control at a group: for next/previous each
# member would ask the shared tuner to move and the station would jump once per
# member. The four buttons of the Tuner section address the source itself, so
# they have that problem by construction — there is one of each, for one tuner.
