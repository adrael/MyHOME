          - type: heading
            heading: Master suite
            heading_style: title
            icon: mdi:bed-king
          - type: tile
            entity: media_player.radio_suite
            name: Suite
            icon: mdi:bed-king
            state_content:
              - state
              - media_title
            features:
              - type: media-player-volume-slider
                show_mute_button: false
          - type: tile
